name: Build & Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    # GitHub Pages serves the ROOT of the main branch. We build the app into
    # the repo root and commit it back, so the published site is always a
    # fresh production build of the latest source.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & smoke-test
        run: npm test

      - name: Commit built site back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets sw.js manifest.webmanifest icon.svg
          if git diff --staged --quiet; then
            echo "Build output unchanged — nothing to publish."
          else
            git commit -m "chore: publish latest build [skip ci]"
            git push
          fi
